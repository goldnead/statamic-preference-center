name: tests

# The matrix covers the ranges composer.json actually promises. A single
# combination would make those constraints a claim nobody verified — and this
# package sits on top of six sibling packages, which is exactly where a
# resolution that only works on one machine hides.

# Kein COMPOSER_AUTH und kein Sibling-Token-Guard mehr: seit 01.08.2026 sind alle
# goldnead-Geschwister oeffentlich und liegen auf Packagist, Composer laedt sie also
# anonym. Vorher brach jeder Job hart ab, wenn SIBLING_REPOS_TOKEN fehlte -- das war
# ehrlicher als ein Composer-404, aber das Secret existierte nie, also war die ganze
# Suite rot. Und COMPOSER_AUTH mit leerem Token ist schlechter als gar keins: Composer
# versucht dann JEDEN dist-Download zu authentifizieren und stirbt an
# "Could not authenticate against github.com", auch bei fremden Paketen.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  pest:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['^12.40', '^13.0']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          # Laravel 13 requires PHP ^8.3.
          - php: '8.2'
            laravel: '^13.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_sqlite, sqlite3, intl, fileinfo, gd
          coverage: none
          tools: composer:v2

      # Several goldnead siblings are private repositories. There is deliberately
      # no `|| github.token` fallback: that token cannot read another private
      # repo, so an unset secret used to surface as a Composer 404 that reads
      # like a network blip. Fail here instead, where the message is true.
      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-progress --no-interaction

      - name: Show installed sibling versions
        run: composer show | grep -E 'goldnead|statamic/cms|laravel/framework'

      - name: Run Pest test suite
        run: vendor/bin/pest --colors=always

  mysql:
    name: MySQL
    runs-on: ubuntu-latest

    # tests/TestCase.php carries a whole second database connection for this
    # job. Without it the safeguard is opt-in, and the InnoDB key-length class
    # of bug it was written for passes a green SQLite suite untouched.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: preference_center_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, intl, fileinfo, gd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run Pest against MySQL
        env:
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: preference_center_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/pest --colors=always

  quality:
    name: Style and static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, intl, fileinfo, gd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Validate composer.json
        run: composer validate --no-check-publish

      # Check, never fix. Auto-committing style onto a contributor's branch
      # rewrites their work without asking.
      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

# Der Job "standards" (addon-lint) lag hier und ist am 01.08.2026 entfernt worden.
# Er klonte das private goldnead/statamic-addon-studio ueber ein STUDIO_TOKEN-Secret.
# Ohne das Secret uebersprang er sich still bzw. scheiterte am Checkout -- also genau
# die Sorte Job, die gruen aussieht und nichts geprueft hat. addon-lint bleibt das
# zentrale Release-Gate im Studio (tools/verify-gate.sh faehrt es ueber alle Repos).
# Wieder hierher zurueck, sobald addon-lint als eigenes Paket auf Packagist liegt --
# dann braucht es kein Secret mehr.
